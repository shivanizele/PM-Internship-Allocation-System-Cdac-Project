spring.application.name=pm-internship-backend
spring.security.user.name=admin
spring.security.user.password=admin



# =====================
# DATABASE
# =====================

spring.datasource.url=jdbc:mysql://localhost:3306/pm_internship_db
spring.datasource.username=root
spring.datasource.password=root


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / HIBERNATE
# =====================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================
# FILE UPLOAD
# =====================
#
#spring.servlet.multipart.max-file-size=20MB
#spring.servlet.multipart.max-request-size=20MB
#
#file.upload-dir=uploads/

# =====================
# JWT
# =====================

jwt.secret=ThisIsMySuperSecretKeyForPmInternshipProject2026AtLeast32CharactersLong
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG

# =====================
# MAIL
# =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=your email
spring.mail.password=token

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=your email

# Example for development with Mailtrap/Ethereal:
# MAIL_HOST=sandbox.smtp.mailtrap.io
# MAIL_PORT=2525
# MAIL_USERNAME=your-username
# MAIL_PASSWORD=your-password
